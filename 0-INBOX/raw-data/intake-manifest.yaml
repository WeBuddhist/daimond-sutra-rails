# Intake manifest — Diamond Sūtra corpus
#
# Read by 4-SYSTEM/Skills/aligned-corpus-intake/scripts/build_sources.py.
# One entry per work to produce, in build order (a work can only align to a
# work listed above it). Paths under `text`, `pair`, `tsadrel`, `align_via`
# are relative to raw_root. Every value here was taken from the raw data:
# the Dzongsar metadata sheets, the OpenPecha text.json files, and the docs
# themselves — see 0-INBOX/dzongsar-drive-inventory.md and
# 0-INBOX/openpecha-api-inventory.md. An empty value means "not recorded
# upstream", never "unknown to the converter".
#
# Colour legends were established by reading each document (2026-10-02);
# they are recorded per work so the sidecar labels every coloured run.

raw_root: 0-INBOX/raw-data
openpecha_root: openpecha-api
sidecar_dir: 1-SOURCES/Annotations

